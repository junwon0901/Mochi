name: Release

# Every push to main that touches the app is built on macOS. When the
# VERSION file names a version that has no release yet, the build is
# published as Mochi.zip in release "v<VERSION>". The app's
# "Check for Updates…" menu item downloads that zip.
on:
  push:
    branches: [main]
    paths: [VERSION, Mochi.swift, build.sh, "sprites/**", icon.png, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: MOCHI_NO_INSTALL=1 ./build.sh
      - name: Package
        run: ditto -c -k --keepParent dist/Mochi.app Mochi.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump VERSION to publish a new one."
          else
            gh release create "$TAG" Mochi.zip --target "$GITHUB_SHA" --title "Mochi ${TAG#v}" --generate-notes
          fi

name: Release

# Bump the VERSION file and push to main: this builds Mochi.app on macOS
# and publishes it as Mochi.zip in the release "v<VERSION>". The app's
# "Check for Updates…" menu item downloads that zip.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: MOCHI_NO_INSTALL=1 ./build.sh
      - name: Package
        run: ditto -c -k --keepParent dist/Mochi.app Mochi.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Mochi.zip --clobber
          else
            gh release create "$TAG" Mochi.zip --target "$GITHUB_SHA" --title "Mochi ${TAG#v}" --generate-notes
          fi
